<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상장사 기업 정보 요약 서비스 (Selective)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .markdown-content h2 { font-size: 1.5rem; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
        .markdown-content p { line-height: 1.8; margin-bottom: 1rem; color: #334155; }
        .markdown-content strong { color: #2563eb; }
        .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .item-card.selected { border-color: #2563eb; background-color: #eff6ff; }
        .content-preview { transition: max-height 0.3s ease-out; overflow: hidden; max-height: 0; }
        .content-preview.open { max-height: 500px; padding-top: 1rem; border-top: 1px dashed #e2e8f0; margin-top: 1rem; }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-12">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-slate-900 mb-4">기업 정보 선택 요약</h1>
            <p class="text-slate-600 text-lg">원하는 정보를 직접 선택하여 AI 요약 보고서를 생성하세요.</p>
        </header>

        <!-- 검색창 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <div class="flex gap-4">
                <input type="text" id="corpName" placeholder="기업명을 입력하세요 (예: 삼성전자)" 
                    class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition-colors shadow-lg shadow-blue-200">
                    정보 검색
                </button>
            </div>
        </div>

        <!-- 정보 목록 영역 -->
        <div id="listArea" class="hidden mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-800">검색된 정보 목록 (<span id="itemCount">0</span>)</h2>
                <div class="flex gap-2">
                    <button id="selectAllBtn" class="text-sm text-blue-600 hover:underline">전체 선택</button>
                    <button id="deselectAllBtn" class="text-sm text-slate-500 hover:underline">선택 해제</button>
                </div>
            </div>
            
            <div id="itemList" class="grid gap-3 mb-6">
                <!-- 정보 아이템들이 여기에 렌더링됨 -->
            </div>

            <div class="sticky bottom-8 bg-white/80 backdrop-blur-md p-4 rounded-2xl border border-slate-200 shadow-xl flex justify-center">
                <button id="summarizeBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-12 rounded-2xl transition-all transform hover:scale-105 shadow-lg shadow-green-200 flex items-center gap-2">
                    <span id="selectedCount">0</span>개 항목 요약하기
                </button>
            </div>
        </div>

        <!-- 진행 상태 표시 -->
        <div id="statusArea" class="hidden bg-blue-50 border border-blue-100 rounded-2xl p-8 text-center mb-8">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mb-4 mx-auto"></div>
            <p id="statusMessage" class="text-blue-800 font-medium text-lg">데이터를 수집하는 중입니다...</p>
        </div>

        <!-- 결과 영역 -->
        <div id="resultArea" class="hidden">
            <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
                <div class="bg-slate-900 px-8 py-4 flex justify-between items-center">
                    <h2 id="resultTitle" class="text-white text-xl font-bold">분석 결과</h2>
                    <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="text-slate-400 hover:text-white text-sm">다시 검색</button>
                </div>
                <div id="summaryContent" class="markdown-content p-8">
                    <!-- AI 요약 내용이 들어갈 자리 -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
