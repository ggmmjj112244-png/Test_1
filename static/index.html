<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상장사 기업 정보 요약 서비스 (Dark Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: #e2e8f0; }
        .markdown-content h2 { font-size: 1.5rem; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; color: #f8fafc; border-bottom: 2px solid #1e293b; padding-bottom: 0.5rem; }
        .markdown-content p { line-height: 1.8; margin-bottom: 1rem; color: #94a3b8; }
        .markdown-content strong { color: #3b82f6; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .item-card.selected { border-color: #3b82f6; background-color: #0f172a; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .content-preview { transition: max-height 0.3s ease-out; overflow: hidden; }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-12">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-white mb-4 italic tracking-tight">CHART HERO <span class="text-blue-500">PRO</span></h1>
            <p class="text-slate-400 text-lg">상장사 공시와 시장 트렌드를 AI로 정밀 분석합니다.</p>
        </header>

        <!-- 검색창 -->
        <div class="bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 p-8 mb-12">
            <div class="flex gap-4">
                <input type="text" id="corpName" placeholder="기업명을 입력하세요 (예: 삼성전자)" 
                    class="flex-1 bg-slate-950 px-6 py-4 rounded-2xl border border-slate-700 text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder:text-slate-600">
                <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-2xl transition-all shadow-lg shadow-blue-900/20 active:scale-95">
                    정보 검색
                </button>
            </div>
        </div>

        <!-- 정보 목록 영역 -->
        <div id="listArea" class="hidden mb-12">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white flex items-center gap-3">
                    <span class="w-2 h-8 bg-blue-500 rounded-full"></span>
                    검색 결과 (<span id="itemCount" class="text-blue-400">0</span>)
                </h2>
                <div class="flex gap-4">
                    <button id="selectAllBtn" class="text-sm text-slate-400 hover:text-blue-400 transition-colors">전체 선택</button>
                    <button id="deselectAllBtn" class="text-sm text-slate-400 hover:text-red-400 transition-colors">전체 해제</button>
                </div>
            </div>
            
            <div id="itemList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                <!-- 정보 아이템들이 여기에 렌더링됨 -->
            </div>

            <div class="flex justify-center">
                <button id="summarizeBtn" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-5 px-16 rounded-3xl transition-all transform hover:scale-105 shadow-2xl shadow-blue-500/20 flex items-center gap-3 text-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span id="selectedCount">0</span>개 항목 정밀 요약
                </button>
            </div>
        </div>

        <!-- 진행 상태 표시 -->
        <div id="statusArea" class="hidden bg-slate-900/50 border border-slate-800 rounded-3xl p-12 text-center mb-12 backdrop-blur-sm">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-16 w-16 mb-6 mx-auto"></div>
            <p id="statusMessage" class="text-blue-400 font-medium text-xl">데이터를 동기화하고 있습니다...</p>
        </div>

        <!-- 결과 영역 -->
        <div id="resultArea" class="hidden">
            <div class="bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden">
                <div class="bg-slate-800/50 px-8 py-6 border-b border-slate-700 flex justify-between items-center">
                    <h2 id="resultTitle" class="text-white text-2xl font-bold">분석 보고서</h2>
                    <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="text-slate-400 hover:text-white transition-colors border border-slate-600 px-4 py-2 rounded-xl text-sm">새로 검색</button>
                </div>
                <div id="summaryContent" class="markdown-content p-10 bg-slate-900/30">
                    <!-- AI 요약 내용이 들어갈 자리 -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
